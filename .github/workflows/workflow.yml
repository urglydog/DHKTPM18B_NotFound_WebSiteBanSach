name: Deploy Spring Boot to Multiple AWS EC2s

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Deploy lên EC2-1
      - name: Stop old app on EC2-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_1_HOST }}
          username: ${{ secrets.EC2_USERC }}
          key: ${{ secrets.EC2_SSH_KEYC }}
          script: |
            sudo systemctl stop bookstore || true
            sudo rm -f /opt/bookstore/*.jar

      - name: Copy new JAR to EC2-1
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_1_HOST }}
          username: ${{ secrets.EC2_USERC }}
          key: ${{ secrets.EC2_SSH_KEYC }}
          source: "target/*.jar"
          target: "/opt/bookstore"

      - name: Restart bookstore on EC2-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_1_HOST }}
          username: ${{ secrets.EC2_USERC }}
          key: ${{ secrets.EC2_SSH_KEYC }}
          script: |
            sudo systemctl restart bookstore
            sudo systemctl status bookstore -n 20

      # Deploy lên EC2-2
      - name: Stop old app on EC2-2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_2_HOST }}
          username: ${{ secrets.EC2_USERC }}
          key: ${{ secrets.EC2_SSH_KEYC }}
          script: |
            sudo systemctl stop bookstore || true
            sudo rm -f /opt/bookstore/*.jar

      - name: Copy new JAR to EC2-2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_2_HOST }}
          username: ${{ secrets.EC2_USERC }}
          key: ${{ secrets.EC2_SSH_KEYC }}
          source: "target/*.jar"
          target: "/opt/bookstore"

      - name: Restart bookstore on EC2-2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_2_HOST }}
          username: ${{ secrets.EC2_USERC }}
          key: ${{ secrets.EC2_SSH_KEYC }}
          script: |
            sudo systemctl restart bookstore
            sudo systemctl status bookstore -n 20